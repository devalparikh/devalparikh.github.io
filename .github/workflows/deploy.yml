name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

# Allow one deploy at a time; queued runs supersede each other.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck

      # `npm run build` derives web-sized images from photos/ and then exports
      # the static site to ./out.
      - name: Build
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
